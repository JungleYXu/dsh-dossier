<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>卷宗 · 图标预览</title>
<style>
  body { margin: 0; padding: 24px 28px; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: #1f2328; background: #fff; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: #656d76; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 6px; max-width: 760px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border: 1px solid #eaeef2; border-radius: 8px; }
  .cell small { font-size: 10px; color: #8b949e; }
  .sizes { display: flex; align-items: center; gap: 10px; }
  .sizes svg { display: block; }
  .big svg { width: 42px; height: 42px; }
  .bar { display: flex; align-items: center; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid #eaeef2; }
  .hb { font: inherit; font-size: 12px; height: 28px; padding: 0 10px 0 8px; border-radius: 999px; border: 1px solid #d0d7de; background: transparent; color: #1f2328; display: inline-flex; align-items: center; gap: 6px; }
  .hb .ico { display: inline-flex; align-items: center; opacity: .85; }
  .hb.busy { color: #1a7f37; border-color: #1a7f37; border-style: dashed; }
  .hb.ok { color: #1f2328; border-color: #1a7f37; }
  .sidebar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; background: #f6f8fa; width: max-content; }
</style>
</head>
<body>
<h1>图标：16 网格 · 1.5 描边 · 圆头圆角</h1>
<p>每格左侧是面板里的实际大小（14px），右侧放大到 42px 看细节。最后一行是交接按钮三态与侧栏入口。改图标只改 client.js 里的 GLYPHS，这一页只是同尺寸对照。</p>
<div class="grid" id="grid"></div>
<div class="bar" id="bar"></div>

<script>
const G = {
  folder: { s: ['M2.6 5.2a1 1 0 0 1 1-1h3l1.6 2h4.2a1 1 0 0 1 1 1v5.2a1 1 0 0 1-1 1H3.6a1 1 0 0 1-1-1z'] },
  doc: { s: ['M4.6 2.6h4.1l2.7 2.7v8.1H4.6z', 'M8.7 2.7v2.7h2.7'] },
  chat: { s: ['M3 9.2V6.4a2.2 2.2 0 0 1 2.2-2.2h5.6A2.2 2.2 0 0 1 13 6.4v2.8a2.2 2.2 0 0 1-2.2 2.2H7.4L4.8 13.4v-2A2.2 2.2 0 0 1 3 9.2z'],
          f: ['M5.9 7.05a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z', 'M8 7.05a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z', 'M10.1 7.05a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z'] },
  pin: { s: ['M6.4 2.9h3.2l-.5 3.1 1.6 1.8H5.3l1.6-1.8z', 'M8 7.8v5.6'] },
  check: { s: ['M3.4 3.4h9.2v9.2H3.4z', 'M5.7 8.1l1.6 1.7 3.1-3.6'] },
  export: { s: ['M3.2 10.4v2.4h9.6v-2.4', 'M8 3.1v6.4', 'M5.6 5.5L8 3.1l2.4 2.4'] },
  import: { s: ['M3.2 10.4v2.4h9.6v-2.4', 'M8 3.1v6.4', 'M5.6 7.1L8 9.5l2.4-2.4'] },
  del: { s: ['M3.3 4.7h9.4', 'M6.5 4.7V3.2h3v1.5', 'M4.9 4.7l.6 8.1h5l.6-8.1'] },
  locate: { s: ['M8 4.9a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2Z', 'M8 1.9v2.1', 'M8 12v2.1', 'M1.9 8h2.1', 'M12 8h2.1'],
            f: ['M8 7.1a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8Z'] },
  edit: { s: ['M3 13l3.3-.6 6.8-6.8-2.7-2.7L3.6 9.7z', 'M8.9 3l2.7 2.7'] },
  up: { s: ['M8 12.9V3.3', 'M4.7 6.6L8 3.3l3.3 3.3'] },
  down: { s: ['M8 3.1v9.6', 'M4.7 9.4L8 12.7l3.3-3.3'] },
  out: { s: ['M9.7 3.4h2.7a1 1 0 0 1 1 1v7.2a1 1 0 0 1-1 1H9.7', 'M3 8h7.4', 'M7.8 5.6L10.2 8l-2.4 2.4'] },
}

function svg(name, size) {
  const it = G[name]
  const paths = (it.s || []).map((d) => `<path d="${d}" fill="none"/>`).join('') +
                (it.f || []).map((d) => `<path d="${d}" fill="currentColor" stroke="none"/>`).join('')
  return `<svg viewBox="0 0 16 16" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`
}

const grid = document.getElementById('grid')
for (const name of Object.keys(G)) {
  const cell = document.createElement('div')
  cell.className = 'cell'
  cell.innerHTML = `<div class="sizes">${svg(name, 14)}<span class="big">${svg(name, 42)}</span></div><small>${name}</small>`
  grid.appendChild(cell)
}

const archive = `<svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 8.3h16.8v9.2a1.4 1.4 0 0 1-1.4 1.4H5a1.4 1.4 0 0 1-1.4-1.4z"/><path d="M2.8 5.1h18.4v3.2H2.8z"/><path d="M9.4 12.8h5.2"/></svg>`
document.getElementById('bar').innerHTML =
  `<button class="hb"><span class="ico">${svg('doc', 14)}</span><span>交接</span></button>
   <button class="hb busy"><span class="ico">${svg('doc', 14)}</span><span>生成中…</span></button>
   <button class="hb ok"><span class="ico">${svg('doc', 14)}</span><span>已生成</span></button>
   <span class="sidebar"><span class="ico">${archive}</span><span>卷宗</span></span>`
</script>
</body>
</html>
