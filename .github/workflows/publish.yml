name: publish

# Publishing lives here rather than in a local shell so the artifact is built
# from a clean checkout at a tagged commit, and so nobody needs a registry
# password on their laptop. Two ways in, tried in that order:
#
#   1. Trusted publishing (no secret at all): npmjs.com -> the package ->
#      Settings -> Trusted publishing -> add this repository and this workflow
#      file name. The run exchanges GitHub's OIDC token for a short-lived
#      publish token; nothing long-lived is stored anywhere.
#   2. An NPM_TOKEN secret, for accounts that still hand those out.
#
# Trusted publishing needs npm >= 11.5.1, which is why the run upgrades npm
# instead of using the one bundled with Node 22.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url here on purpose: setup-node writes an .npmrc with a
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} placeholder, and with
      # no token configured npm would try to resolve that empty value instead of
      # going through the OIDC exchange. Setting the registry explicitly keeps
      # .npmrc free of any auth line, which is what trusted publishing wants.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm config set registry https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm test
      - name: Check for a publish token
        id: token
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Trusted publishing: no NODE_AUTH_TOKEN in the environment, so npm goes
      # through the OIDC exchange described above.
      - name: npm publish (trusted publishing)
        if: steps.token.outputs.present != 'true'
        run: |
          set -u
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-dossier@$version" version >/dev/null 2>&1; then
            echo "::notice title=already on the registry::$version is already published; nothing to do."
            exit 0
          fi
          npm publish --access public
      # Token path, kept for accounts that still issue tokens. v0.12.5 of a
      # sibling package failed here with TLOG_CREATE_ENTRY_ERROR (409): the
      # transparency log already held an equivalent entry. Two fallbacks keep a
      # single bad entry from blocking a release: if the version is in fact on
      # the registry, treat it as published; otherwise publish once more
      # without provenance.
      - name: npm publish (token)
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          version="$(node -p "require('./package.json').version")"
          published() {
            npm view "dsh-dossier@$version" version >/dev/null 2>&1
          }
          if npm publish --access public --provenance; then
            exit 0
          fi
          if published; then
            echo "::notice title=npm publish had an error after registering::$version is on the registry despite the error above."
            exit 0
          fi
          echo "::warning title=retrying without provenance::publish with provenance failed; retrying once without it."
          npm publish --access public
